name: Android CI & Release

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      allow_signature_change:
        description: 'Consenti cambio firma rispetto alla release precedente (solo migrazioni volute)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Test, Compilazione e Release APK
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release):')"

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Calcola versione progressiva CI
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source version.properties
          MAJOR=${VERSION_MAJOR:-1}
          MINOR=${VERSION_MINOR:-0}
          BASE_PATCH=${VERSION_PATCH:-0}
          BASE_CODE=${VERSION_CODE:-1}

          git fetch --tags --quiet || true

          MAX_RELEASE_BUILD=$(python3 - <<'PY'
          import json, os, re, urllib.request
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")
          max_build = 0
          if repo:
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases?per_page=100")
              req.add_header("Accept", "application/vnd.github+json")
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      for rel in json.loads(resp.read().decode("utf-8")):
                          name = rel.get("name") or ""
                          m = re.search(r"\(build\s+(\d+)\)", name)
                          if m:
                              max_build = max(max_build, int(m.group(1)))
              except Exception:
                  pass
          print(max_build)
          PY
          )

          HIGHEST_PATCH_FOR_PREFIX=$(python3 - <<PY
          import re, subprocess
          major, minor = int("${MAJOR}"), int("${MINOR}")
          max_patch = -1
          out = subprocess.check_output(["git", "tag", "-l", f"v{major}.{minor}.*"], text=True)
          for line in out.splitlines():
              m = re.match(rf"^v{major}\.{minor}\.(\d+)$", line.strip())
              if m:
                  max_patch = max(max_patch, int(m.group(1)))
          print(max_patch)
          PY
          )

          PROGRESSIVE_CODE=$((BASE_CODE + GITHUB_RUN_NUMBER))
          if [ "$PROGRESSIVE_CODE" -le "$MAX_RELEASE_BUILD" ]; then
            PROGRESSIVE_CODE=$((MAX_RELEASE_BUILD + 1))
          fi

          PROGRESSIVE_PATCH=$((BASE_PATCH + GITHUB_RUN_NUMBER))
          if [ "$HIGHEST_PATCH_FOR_PREFIX" -ge "$PROGRESSIVE_PATCH" ]; then
            PROGRESSIVE_PATCH=$((HIGHEST_PATCH_FOR_PREFIX + 1))
          fi
          while git rev-parse "v${MAJOR}.${MINOR}.${PROGRESSIVE_PATCH}" >/dev/null 2>&1; do
            PROGRESSIVE_PATCH=$((PROGRESSIVE_PATCH + 1))
          done

          PROGRESSIVE_NAME="${MAJOR}.${MINOR}.${PROGRESSIVE_PATCH}"
          echo "code=$PROGRESSIVE_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$PROGRESSIVE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$PROGRESSIVE_NAME" >> "$GITHUB_OUTPUT"
          echo "Versione progressiva: v$PROGRESSIVE_NAME (versionCode=$PROGRESSIVE_CODE)"

      - name: Prepara debug.keystore coerente (priorita al Secret GitHub)
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "::warning::debug.keystore.base64 e DEBUG_KEYSTORE_BASE64 mancanti: creo keystore temporaneo."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Esegui test unitari e Robolectric
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Verifica firma release (Secrets GitHub)
        id: signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] || [ -n "$STORE_PASSWORD" ] || [ -n "$KEY_PASSWORD" ]; then
            if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error::Configurazione firma release incompleta: imposta tutti e 3 i Secrets (RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD)."
              exit 1
            fi
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > my-upload-key.jks
            if ! keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload >/dev/null 2>&1; then
              echo "::error::Keystore release non valido, password errata o alias 'upload' mancante."
              rm -f my-upload-key.jks
              exit 1
            fi
            echo "has_release_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compila APK Release firmato
        if: steps.signing.outputs.has_release_signing == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gradle :app:assembleRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }} \
            -PgithubRepo=${{ github.repository }} \
            --no-daemon
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk \
            "artifacts/PantryMaster-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}.apk"
          rm -f my-upload-key.jks

      - name: Compila APK installabile (Debug firmato)
        if: steps.signing.outputs.has_release_signing != 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gradle :app:assembleDebug \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }} \
            -PgithubRepo=${{ github.repository }} \
            --no-daemon
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
            "artifacts/PantryMaster-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}.apk"

      - name: Verifica coerenza firma rispetto alla release precedente
        id: cert_check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_SIG_CHANGE: ${{ inputs.allow_signature_change || false }}
          HAS_RELEASE_SIGNING: ${{ steps.signing.outputs.has_release_signing }}
        run: |
          set -euo pipefail
          APK_FILE=$(ls artifacts/*.apk | head -n 1)
          NEW_CERT=$(keytool -printcert -jarfile "$APK_FILE")
          NEW_OWNER=$(printf '%s\n' "$NEW_CERT" | grep -m1 "Owner:" | sed 's/^[[:space:]]*Owner:[[:space:]]*//')
          NEW_SHA256=$(printf '%s\n' "$NEW_CERT" | grep -m1 "SHA256:" | sed 's/.*SHA256:[[:space:]]*//')
          echo "Owner nuova build: $NEW_OWNER"
          echo "SHA256 nuova build: $NEW_SHA256"
          echo "sha256=$NEW_SHA256" >> "$GITHUB_OUTPUT"
          echo "build_kind=$([ "$HAS_RELEASE_SIGNING" = "true" ] && echo "Release firmata" || echo "Debug (chiave di sviluppo)")" >> "$GITHUB_OUTPUT"

          PREV_URL=$(python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")
          if not repo:
              print("")
              raise SystemExit(0)
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases?per_page=10")
          req.add_header("Accept", "application/vnd.github+json")
          if token:
              req.add_header("Authorization", f"Bearer {token}")
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  for rel in json.loads(resp.read().decode("utf-8")):
                      if rel.get("draft"):
                          continue
                      for asset in rel.get("assets") or []:
                          name = (asset.get("name") or "").lower()
                          url = asset.get("browser_download_url") or ""
                          if name.endswith(".apk") and url:
                              print(url)
                              raise SystemExit(0)
          except Exception:
              pass
          print("")
          PY
          )

          if [ -n "$PREV_URL" ]; then
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$PREV_URL" -o /tmp/prev_release.apk || true
            if [ -s /tmp/prev_release.apk ]; then
              PREV_CERT=$(keytool -printcert -jarfile /tmp/prev_release.apk 2>/dev/null || true)
              PREV_OWNER=$(printf '%s\n' "$PREV_CERT" | grep -m1 "Owner:" | sed 's/^[[:space:]]*Owner:[[:space:]]*//')
              PREV_SHA256=$(printf '%s\n' "$PREV_CERT" | grep -m1 "SHA256:" | sed 's/.*SHA256:[[:space:]]*//')
              rm -f /tmp/prev_release.apk
              echo "SHA256 release precedente: $PREV_SHA256 ($PREV_OWNER)"

              if [ -n "$PREV_SHA256" ] && [ "$NEW_SHA256" != "$PREV_SHA256" ]; then
                if [ "$ALLOW_SIG_CHANGE" = "true" ]; then
                  echo "::warning::Cambio firma consentito manualmente ($PREV_SHA256 -> $NEW_SHA256)."
                elif echo "$PREV_OWNER" | grep -q "CN=Android Debug" && [ "$HAS_RELEASE_SIGNING" = "true" ]; then
                  echo "::warning::Prima migrazione da Debug a Release firmata ($PREV_SHA256 -> $NEW_SHA256)."
                elif ! echo "$PREV_OWNER" | grep -q "CN=Android Debug" && [ "$HAS_RELEASE_SIGNING" != "true" ]; then
                  echo "::error::La release precedente era firmata in modalità Release ($PREV_SHA256), ma i Secrets di firma non sono attivi in questa build. Impossibile pubblicare un APK Debug sopra una Release."
                  exit 1
                elif [ "$HAS_RELEASE_SIGNING" = "true" ]; then
                  echo "::error::Il keystore Release nei Secrets ($NEW_SHA256) è diverso da quello della release precedente ($PREV_SHA256). Ripristina il keystore originale nei Secrets o avvia manualmente con allow_signature_change=true."
                  exit 1
                else
                  echo "::error::La firma Debug ($NEW_SHA256) è diversa dalla release precedente ($PREV_SHA256). Per non avere più errori di firma, configura stabilmente RELEASE_KEYSTORE_BASE64 / STORE_PASSWORD / KEY_PASSWORD (oppure DEBUG_KEYSTORE_BASE64) nei Secrets GitHub, o avvia manualmente con allow_signature_change=true."
                  exit 1
                fi
              fi
            fi
          fi

      - name: Carica report test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Carica APK come artefatto workflow
        uses: actions/upload-artifact@v4
        with:
          name: PantryMaster-v${{ steps.version.outputs.name }}-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: Pubblica GitHub Release con APK
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PantryMaster ${{ steps.version.outputs.tag }} (build ${{ steps.version.outputs.code }})
          body: |
            - **Tipo pacchetto:** ${{ steps.cert_check.outputs.build_kind }}
            - **Firma SHA-256:** `${{ steps.cert_check.outputs.sha256 }}`
          generate_release_notes: true
          make_latest: true
          files: artifacts/*.apk
