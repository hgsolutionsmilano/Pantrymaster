name: Android CI (Solo Verifica Codice e Test)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verifica Dipendenze, Debug Build, Kotlin Release e Test
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout codice
        uses: actions/checkout@v4

      - name: 2. Configura JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 3. Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 4. Verifica sicurezza repository (nessun keystore o segreto tracciato)
        shell: bash
        run: |
          set -euo pipefail
          TRACKED=$(git ls-files '*.jks' '*.keystore' '*.p12' '*.pfx' '*.enc' '.env' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::Trovati file sensibili tracciati da Git: $TRACKED"
            exit 1
          fi

      - name: 5. Prepara keystore Debug temporaneo standard per CI
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            if [ -f "$HOME/.android/debug.keystore" ]; then
              cp "$HOME/.android/debug.keystore" debug.keystore
            else
              CI_DBG_PASS="android"
              export CI_DBG_PASS
              keytool -genkeypair \
                -keystore debug.keystore \
                -storetype PKCS12 \
                -alias androiddebugkey \
                -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10950 \
                -storepass:env CI_DBG_PASS \
                -keypass:env CI_DBG_PASS >/dev/null 2>&1
              unset CI_DBG_PASS
            fi
          fi

      - name: 6. Verifica delle dipendenze
        run: gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon >/dev/null

      - name: 7. Compilazione Debug
        run: gradle :app:assembleDebug --no-daemon

      - name: 8. Verifica firma APK Debug e blocco Release
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          else
            echo "::warning::apksigner non trovato in $SDK_DIR/build-tools; verifica firma saltata."
          fi
          if gradle :app:verifyReleaseSigning --no-daemon >/dev/null 2>&1; then
            echo "::error::La build Release non deve procedere senza keystore Release privato."
            exit 1
          fi
          echo "OK: protezione firma Release attiva (nessun fallback a Debug)."

      - name: 9. Verifica compilazione Kotlin Release (senza keystore privato)
        run: gradle :app:compileReleaseKotlin --no-daemon

      - name: 10. Esecuzione test unitari e Robolectric
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: 11. Pulizia keystore temporaneo Debug
        if: always()
        shell: bash
        run: rm -f debug.keystore

      - name: 12. Carica report test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
