name: Android CI & Release

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      allow_signature_change:
        description: 'Consenti cambio firma rispetto alla release precedente (solo migrazioni volute)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: CI Verifica, Firma Release e Pubblicazione
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release):')"

    steps:
      - name: 1. Checkout codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configura JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 3. Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Rileva modalita pipeline (CI o Release)
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "publish_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verifica Secrets firma Release (obbligatori per pubblicazione Release)
        if: steps.mode.outputs.publish_release == 'true'
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secrets di firma Release mancanti. Per pubblicare su main/master o workflow_dispatch configura RELEASE_KEYSTORE_BASE64, STORE_PASSWORD e KEY_PASSWORD in Settings -> Secrets -> Actions. Nessun APK Debug verra pubblicato come Release."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > my-upload-key.jks
          if ! keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload >/dev/null 2>&1; then
            echo "::error::Keystore Release non valido, STORE_PASSWORD errata o alias 'upload' mancante."
            rm -f my-upload-key.jks
            exit 1
          fi
          CERT_DN=$(keytool -list -v -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload 2>/dev/null | grep -m1 "Owner:" || true)
          if echo "$CERT_DN" | grep -qi "CN=Android Debug"; then
            echo "::error::Il keystore configurato in RELEASE_KEYSTORE_BASE64 e un certificato Android Debug."
            rm -f my-upload-key.jks
            exit 1
          fi

      - name: Prepara debug.keystore coerente (priorita al Secret GitHub)
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
          else
            echo "::error::DEBUG_KEYSTORE_BASE64 e debug.keystore.base64 mancanti."
            exit 1
          fi
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: 4. Verifica delle dipendenze
        run: gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon >/dev/null

      - name: 5. Compilazione Debug
        run: gradle :app:assembleDebug --no-daemon

      - name: 6. Esecuzione test unitari e Robolectric
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Calcola versione progressiva Release
        id: version
        if: steps.mode.outputs.publish_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source version.properties
          MAJOR=${VERSION_MAJOR:-1}
          MINOR=${VERSION_MINOR:-0}
          BASE_PATCH=${VERSION_PATCH:-0}
          BASE_CODE=${VERSION_CODE:-1}

          git fetch --tags --quiet || true

          MAX_RELEASE_BUILD=$(python3 - <<'PY'
          import json, os, re, urllib.request
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")
          max_build = 0
          if repo:
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases?per_page=100")
              req.add_header("Accept", "application/vnd.github+json")
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      for rel in json.loads(resp.read().decode("utf-8")):
                          name = rel.get("name") or ""
                          m = re.search(r"\(build\s+(\d+)\)", name)
                          if m:
                              max_build = max(max_build, int(m.group(1)))
              except Exception:
                  pass
          print(max_build)
          PY
          )

          HIGHEST_PATCH_FOR_PREFIX=$(python3 - <<PY
          import re, subprocess
          major, minor = int("${MAJOR}"), int("${MINOR}")
          max_patch = -1
          out = subprocess.check_output(["git", "tag", "-l", f"v{major}.{minor}.*"], text=True)
          for line in out.splitlines():
              m = re.match(rf"^v{major}\.{minor}\.(\d+)$", line.strip())
              if m:
                  max_patch = max(max_patch, int(m.group(1)))
          print(max_patch)
          PY
          )

          PROGRESSIVE_CODE=$((BASE_CODE + GITHUB_RUN_NUMBER))
          if [ "$PROGRESSIVE_CODE" -le "$MAX_RELEASE_BUILD" ]; then
            PROGRESSIVE_CODE=$((MAX_RELEASE_BUILD + 1))
          fi

          PROGRESSIVE_PATCH=$((BASE_PATCH + GITHUB_RUN_NUMBER))
          if [ "$HIGHEST_PATCH_FOR_PREFIX" -ge "$PROGRESSIVE_PATCH" ]; then
            PROGRESSIVE_PATCH=$((HIGHEST_PATCH_FOR_PREFIX + 1))
          fi
          while git rev-parse "v${MAJOR}.${MINOR}.${PROGRESSIVE_PATCH}" >/dev/null 2>&1; do
            PROGRESSIVE_PATCH=$((PROGRESSIVE_PATCH + 1))
          done

          PROGRESSIVE_NAME="${MAJOR}.${MINOR}.${PROGRESSIVE_PATCH}"
          echo "code=$PROGRESSIVE_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$PROGRESSIVE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$PROGRESSIVE_NAME" >> "$GITHUB_OUTPUT"
          echo "Versione Release: v$PROGRESSIVE_NAME (versionCode=$PROGRESSIVE_CODE)"

      - name: 7-8. Compilazione e Firma APK Release
        if: steps.mode.outputs.publish_release == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }} \
            -PgithubRepo=${{ github.repository }} \
            --no-daemon
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk \
            "artifacts/PantryMaster-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}.apk"

      - name: Pulizia file keystore temporanei
        if: always()
        shell: bash
        run: rm -f my-upload-key.jks debug.keystore

      - name: 9. Verifica crittografica firma (apksigner) e continuità certificato
        id: cert_check
        if: steps.mode.outputs.publish_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_SIG_CHANGE: ${{ inputs.allow_signature_change || false }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::Strumento apksigner non trovato in $SDK_ROOT/build-tools."
            exit 1
          fi

          APK_FILE="artifacts/PantryMaster-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}.apk"
          VERIFY_OUT=$("$APKSIGNER" verify --verbose --print-certs "$APK_FILE")
          printf '%s\n' "$VERIFY_OUT"

          NEW_DN=$(printf '%s\n' "$VERIFY_OUT" | grep -m1 "Signer #1 certificate DN:" | sed 's/.*DN:[[:space:]]*//')
          NEW_HEX=$(printf '%s\n' "$VERIFY_OUT" | grep -m1 "Signer #1 certificate SHA-256 digest:" | sed 's/.*digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]:')
          if [ -z "$NEW_HEX" ]; then
            echo "::error::Impossibile leggere il digest SHA-256 della firma dell'APK."
            exit 1
          fi
          if echo "$NEW_DN" | grep -qi "CN=Android Debug"; then
            echo "::error::L'APK Release risulta firmato con certificato Android Debug. Pubblicazione bloccata."
            exit 1
          fi

          NEW_COLON=$(printf '%s' "$NEW_HEX" | sed 's/\(..\)/\1:/g; s/:$//')
          echo "sha256=$NEW_COLON" >> "$GITHUB_OUTPUT"

          PREV_URL=$(python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")
          if not repo:
              print("")
              raise SystemExit(0)
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases?per_page=10")
          req.add_header("Accept", "application/vnd.github+json")
          if token:
              req.add_header("Authorization", f"Bearer {token}")
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  for rel in json.loads(resp.read().decode("utf-8")):
                      if rel.get("draft"):
                          continue
                      for asset in rel.get("assets") or []:
                          name = (asset.get("name") or "").lower()
                          url = asset.get("browser_download_url") or ""
                          if name.endswith(".apk") and url:
                              print(url)
                              raise SystemExit(0)
          except Exception:
              pass
          print("")
          PY
          )

          if [ -n "$PREV_URL" ]; then
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$PREV_URL" -o /tmp/prev_release.apk || true
            if [ -s /tmp/prev_release.apk ]; then
              PREV_OUT=$("$APKSIGNER" verify --print-certs /tmp/prev_release.apk 2>/dev/null || true)
              PREV_DN=$(printf '%s\n' "$PREV_OUT" | grep -m1 "Signer #1 certificate DN:" | sed 's/.*DN:[[:space:]]*//')
              PREV_HEX=$(printf '%s\n' "$PREV_OUT" | grep -m1 "Signer #1 certificate SHA-256 digest:" | sed 's/.*digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]:')
              rm -f /tmp/prev_release.apk

              if [ -n "$PREV_HEX" ] && [ "$NEW_HEX" != "$PREV_HEX" ]; then
                if [ "$ALLOW_SIG_CHANGE" = "true" ]; then
                  echo "::warning::Cambio firma consentito manualmente ($PREV_HEX -> $NEW_HEX)."
                elif echo "$PREV_DN" | grep -qi "CN=Android Debug"; then
                  echo "::warning::Prima migrazione da vecchia build Debug a firma Release permanente ($PREV_HEX -> $NEW_HEX)."
                else
                  echo "::error::Il certificato Release ($NEW_COLON) NON corrisponde alla release precedente ($PREV_HEX). Ripristina il keystore originale nei Secrets GitHub o usa allow_signature_change=true solo per migrazioni intenzionali."
                  exit 1
                fi
              fi
            fi
          fi

      - name: 10. Verifica applicationId, versionCode e versionName (aapt2)
        if: steps.mode.outputs.publish_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2=$(find "$SDK_ROOT/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$AAPT2" ] || [ ! -x "$AAPT2" ]; then
            echo "::error::Strumento aapt2 non trovato in $SDK_ROOT/build-tools."
            exit 1
          fi

          APK_FILE="artifacts/PantryMaster-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}.apk"
          BADGING=$("$AAPT2" dump badging "$APK_FILE" | head -n 1)
          echo "APK manifest: $BADGING"

          EXPECTED_PKG="com.aistudio.pantrymaster.vrkqzm"
          EXPECTED_CODE="${{ steps.version.outputs.version_code }}"
          EXPECTED_NAME="${{ steps.version.outputs.version_name }}"

          echo "$BADGING" | grep -q "name='${EXPECTED_PKG}'" || {
            echo "::error::applicationId non corrispondente (atteso ${EXPECTED_PKG})."
            exit 1
          }
          echo "$BADGING" | grep -q "versionCode='${EXPECTED_CODE}'" || {
            echo "::error::versionCode non corrispondente (atteso ${EXPECTED_CODE})."
            exit 1
          }
          echo "$BADGING" | grep -q "versionName='${EXPECTED_NAME}'" || {
            echo "::error::versionName non corrispondente (atteso ${EXPECTED_NAME})."
            exit 1
          }

      - name: 11. Genera checksum SHA-256 APK
        if: steps.mode.outputs.publish_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          for f in *.apk; do
            sha256sum "$f" > "${f}.sha256"
          done
          cat *.sha256

      - name: Carica report test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: 12. Pubblica APK e checksum come Artifact GitHub
        if: steps.mode.outputs.publish_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PantryMaster-v${{ steps.version.outputs.name }}-apk
          path: artifacts/*
          retention-days: 30

      - name: Pubblica GitHub Release con APK firmato
        if: steps.mode.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PantryMaster ${{ steps.version.outputs.tag }} (build ${{ steps.version.outputs.code }})
          body: |
            - **Tipo pacchetto:** Release firmata
            - **Application ID:** `com.aistudio.pantrymaster.vrkqzm`
            - **Firma certificato SHA-256:** `${{ steps.cert_check.outputs.sha256 }}`
          generate_release_notes: true
          make_latest: true
          files: artifacts/*
