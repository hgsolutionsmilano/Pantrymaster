name: Android CI (Solo Verifica Codice e Test)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verifica Dipendenze, Debug Build, Kotlin Release e Test
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout codice
        uses: actions/checkout@v4

      - name: 2. Configura JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 3. Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 4. Prepara debug.keystore da repository (nessuna chiave generata)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore.base64 ]; then
            echo "::error::debug.keystore.base64 mancante nel repository."
            exit 1
          fi
          tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: 5. Verifica sicurezza repository (nessun keystore o segreto tracciato)
        shell: bash
        run: |
          set -euo pipefail
          TRACKED=$(git ls-files '*.jks' '*.keystore' '*.p12' '*.pfx' '*.enc' '.env' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::Trovati file sensibili tracciati da Git: $TRACKED"
            exit 1
          fi

      - name: 6. Verifica delle dipendenze
        run: gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon >/dev/null

      - name: 7. Compilazione Debug
        run: gradle :app:assembleDebug --no-daemon

      - name: 8. Verifica compilazione Kotlin Release (senza keystore privato)
        run: gradle :app:compileReleaseKotlin --no-daemon

      - name: 9. Esecuzione test unitari e Robolectric
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: 10. Pulizia keystore temporaneo Debug
        if: always()
        shell: bash
        run: rm -f debug.keystore

      - name: 11. Carica report test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
