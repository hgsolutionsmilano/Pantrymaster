name: Release Progressiva

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Tipo di incremento versione (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Pubblica come pre-release'
        required: false
        default: false
        type: boolean
      allow_signature_change:
        description: 'Consenti cambio firma rispetto alla release precedente (solo migrazioni volute)'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build e Pubblicazione Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Incrementa versione e crea tag (workflow_dispatch)
        id: bump
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source version.properties
          MAJOR=${VERSION_MAJOR:-1}
          MINOR=${VERSION_MINOR:-0}
          PATCH=${VERSION_PATCH:-0}
          CODE=${VERSION_CODE:-1}
          REPO=${GITHUB_REPO:-}

          git fetch --tags --quiet || true

          MAX_RELEASE_BUILD=$(python3 - <<'PY'
          import json, os, re, urllib.request
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")
          max_build = 0
          if repo:
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases?per_page=100")
              req.add_header("Accept", "application/vnd.github+json")
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      for rel in json.loads(resp.read().decode("utf-8")):
                          name = rel.get("name") or ""
                          m = re.search(r"\(build\s+(\d+)\)", name)
                          if m:
                              max_build = max(max_build, int(m.group(1)))
              except Exception:
                  pass
          print(max_build)
          PY
          )

          HIGHEST_TAG=$(python3 - <<'PY'
          import re, subprocess
          best = (0, 0, 0)
          out = subprocess.check_output(["git", "tag", "-l", "v*.*.*"], text=True)
          for line in out.splitlines():
              m = re.match(r"^v(\d+)\.(\d+)\.(\d+)$", line.strip())
              if m:
                  ver = (int(m.group(1)), int(m.group(2)), int(m.group(3)))
                  if ver > best:
                      best = ver
          print(f"{best[0]} {best[1]} {best[2]}")
          PY
          )
          read -r TAG_MAJ TAG_MIN TAG_PAT <<< "$HIGHEST_TAG"
          if [ $((TAG_MAJ * 1000000 + TAG_MIN * 1000 + TAG_PAT)) -gt $((MAJOR * 1000000 + MINOR * 1000 + PATCH)) ]; then
            MAJOR=$TAG_MAJ
            MINOR=$TAG_MIN
            PATCH=$TAG_PAT
          fi

          case "${{ inputs.bump_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          while git rev-parse "v${MAJOR}.${MINOR}.${PATCH}" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
          done
          CODE=$((CODE >= GITHUB_RUN_NUMBER ? CODE + 1 : GITHUB_RUN_NUMBER))
          if [ "$CODE" -le "$MAX_RELEASE_BUILD" ]; then
            CODE=$((MAX_RELEASE_BUILD + 1))
          fi
          NEW_NAME="${MAJOR}.${MINOR}.${PATCH}"
          TAG_NAME="v${NEW_NAME}"

          cat > version.properties <<EOF
          VERSION_MAJOR=${MAJOR}
          VERSION_MINOR=${MINOR}
          VERSION_PATCH=${PATCH}
          VERSION_CODE=${CODE}
          GITHUB_REPO=${REPO}
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(release): ${TAG_NAME} (build ${CODE})"
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME} (versionCode ${CODE})"
          git push origin HEAD
          git push origin "${TAG_NAME}"

          echo "version_name=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Risolvi versione da tag (push tag)
        id: tag_ver
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source version.properties
          RAW_TAG="${GITHUB_REF_NAME#v}"
          BASE_CODE=${VERSION_CODE:-1}
          MAX_RELEASE_BUILD=$(python3 - <<'PY'
          import json, os, re, urllib.request
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")
          max_build = 0
          if repo:
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases?per_page=100")
              req.add_header("Accept", "application/vnd.github+json")
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      for rel in json.loads(resp.read().decode("utf-8")):
                          name = rel.get("name") or ""
                          m = re.search(r"\(build\s+(\d+)\)", name)
                          if m:
                              max_build = max(max_build, int(m.group(1)))
              except Exception:
                  pass
          print(max_build)
          PY
          )
          PROGRESSIVE_CODE=$((BASE_CODE > GITHUB_RUN_NUMBER ? BASE_CODE : GITHUB_RUN_NUMBER))
          if [ "$PROGRESSIVE_CODE" -le "$MAX_RELEASE_BUILD" ]; then
            PROGRESSIVE_CODE=$((MAX_RELEASE_BUILD + 1))
          fi
          echo "version_name=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${PROGRESSIVE_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Imposta variabili versione finali
        id: final_ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version_name=${{ steps.bump.outputs.version_name }}" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ steps.bump.outputs.version_code }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ steps.bump.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version_name=${{ steps.tag_ver.outputs.version_name }}" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ steps.tag_ver.outputs.version_code }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ steps.tag_ver.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepara debug.keystore coerente (priorita al Secret GitHub)
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "::warning::debug.keystore.base64 e DEBUG_KEYSTORE_BASE64 mancanti: creo keystore temporaneo."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Esegui test unitari
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Prepara firma release (Secrets GitHub)
        id: signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] || [ -n "$STORE_PASSWORD" ] || [ -n "$KEY_PASSWORD" ]; then
            if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error::Configurazione firma release incompleta: imposta tutti e 3 i Secrets (RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD)."
              exit 1
            fi
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > my-upload-key.jks
            if ! keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload >/dev/null 2>&1; then
              echo "::error::Keystore release non valido, password errata o alias 'upload' mancante."
              rm -f my-upload-key.jks
              exit 1
            fi
            echo "has_release_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compila APK / AAB Release firmata
        if: steps.signing.outputs.has_release_signing == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gradle :app:assembleRelease :app:bundleRelease \
            -PversionCode=${{ steps.final_ver.outputs.version_code }} \
            -PversionName=${{ steps.final_ver.outputs.version_name }} \
            -PgithubRepo=${{ github.repository }} \
            --no-daemon
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk \
            "release-assets/PantryMaster-v${{ steps.final_ver.outputs.version_name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
            "release-assets/PantryMaster-v${{ steps.final_ver.outputs.version_name }}.aab"
          rm -f my-upload-key.jks

      - name: Compila APK installabile (fallback senza keystore release)
        if: steps.signing.outputs.has_release_signing != 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gradle :app:assembleDebug \
            -PversionCode=${{ steps.final_ver.outputs.version_code }} \
            -PversionName=${{ steps.final_ver.outputs.version_name }} \
            -PgithubRepo=${{ github.repository }} \
            --no-daemon
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk \
            "release-assets/PantryMaster-v${{ steps.final_ver.outputs.version_name }}.apk"

      - name: Verifica coerenza firma rispetto alla release precedente
        id: cert_check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_SIG_CHANGE: ${{ inputs.allow_signature_change || false }}
          HAS_RELEASE_SIGNING: ${{ steps.signing.outputs.has_release_signing }}
        run: |
          set -euo pipefail
          APK_FILE=$(ls release-assets/*.apk | head -n 1)
          NEW_CERT=$(keytool -printcert -jarfile "$APK_FILE")
          NEW_OWNER=$(printf '%s\n' "$NEW_CERT" | grep -m1 "Owner:" | sed 's/^[[:space:]]*Owner:[[:space:]]*//')
          NEW_SHA256=$(printf '%s\n' "$NEW_CERT" | grep -m1 "SHA256:" | sed 's/.*SHA256:[[:space:]]*//')
          echo "Owner nuova build: $NEW_OWNER"
          echo "SHA256 nuova build: $NEW_SHA256"
          echo "sha256=$NEW_SHA256" >> "$GITHUB_OUTPUT"
          echo "build_kind=$([ "$HAS_RELEASE_SIGNING" = "true" ] && echo "Release firmata" || echo "Debug (chiave di sviluppo)")" >> "$GITHUB_OUTPUT"

          PREV_URL=$(python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")
          if not repo:
              print("")
              raise SystemExit(0)
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases?per_page=10")
          req.add_header("Accept", "application/vnd.github+json")
          if token:
              req.add_header("Authorization", f"Bearer {token}")
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  for rel in json.loads(resp.read().decode("utf-8")):
                      if rel.get("draft"):
                          continue
                      for asset in rel.get("assets") or []:
                          name = (asset.get("name") or "").lower()
                          url = asset.get("browser_download_url") or ""
                          if name.endswith(".apk") and url:
                              print(url)
                              raise SystemExit(0)
          except Exception:
              pass
          print("")
          PY
          )

          if [ -n "$PREV_URL" ]; then
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$PREV_URL" -o /tmp/prev_release.apk || true
            if [ -s /tmp/prev_release.apk ]; then
              PREV_CERT=$(keytool -printcert -jarfile /tmp/prev_release.apk 2>/dev/null || true)
              PREV_OWNER=$(printf '%s\n' "$PREV_CERT" | grep -m1 "Owner:" | sed 's/^[[:space:]]*Owner:[[:space:]]*//')
              PREV_SHA256=$(printf '%s\n' "$PREV_CERT" | grep -m1 "SHA256:" | sed 's/.*SHA256:[[:space:]]*//')
              rm -f /tmp/prev_release.apk
              echo "SHA256 release precedente: $PREV_SHA256 ($PREV_OWNER)"

              if [ -n "$PREV_SHA256" ] && [ "$NEW_SHA256" != "$PREV_SHA256" ]; then
                if [ "$ALLOW_SIG_CHANGE" = "true" ]; then
                  echo "::warning::Cambio firma consentito manualmente ($PREV_SHA256 -> $NEW_SHA256)."
                elif echo "$PREV_OWNER" | grep -q "CN=Android Debug" && [ "$HAS_RELEASE_SIGNING" = "true" ]; then
                  echo "::warning::Prima migrazione da Debug a Release firmata ($PREV_SHA256 -> $NEW_SHA256)."
                elif ! echo "$PREV_OWNER" | grep -q "CN=Android Debug" && [ "$HAS_RELEASE_SIGNING" != "true" ]; then
                  echo "::error::La release precedente era firmata in modalità Release ($PREV_SHA256), ma i Secrets di firma non sono attivi in questa build. Impossibile pubblicare un APK Debug sopra una Release."
                  exit 1
                elif [ "$HAS_RELEASE_SIGNING" = "true" ]; then
                  echo "::error::Il keystore Release nei Secrets ($NEW_SHA256) è diverso da quello della release precedente ($PREV_SHA256). Ripristina il keystore originale nei Secrets o avvia manualmente con allow_signature_change=true."
                  exit 1
                else
                  echo "::error::La firma Debug ($NEW_SHA256) è diversa dalla release precedente ($PREV_SHA256). Per non avere più errori di firma, configura stabilmente RELEASE_KEYSTORE_BASE64 / STORE_PASSWORD / KEY_PASSWORD (oppure DEBUG_KEYSTORE_BASE64) nei Secrets GitHub, o avvia manualmente con allow_signature_change=true."
                  exit 1
                fi
              fi
            fi
          fi

      - name: Pubblica GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.final_ver.outputs.tag_name }}
          name: PantryMaster ${{ steps.final_ver.outputs.tag_name }} (build ${{ steps.final_ver.outputs.version_code }})
          body: |
            - **Tipo pacchetto:** ${{ steps.cert_check.outputs.build_kind }}
            - **Firma SHA-256:** `${{ steps.cert_check.outputs.sha256 }}`
          generate_release_notes: true
          make_latest: true
          prerelease: ${{ inputs.prerelease || false }}
          files: release-assets/*
