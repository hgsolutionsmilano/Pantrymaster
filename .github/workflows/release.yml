name: Verifica Pre-Release (Solo Controlli CI)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre_release_checks:
    name: Controlli Codice Pre-Release (Firma Locale Obbligatoria)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout codice
        uses: actions/checkout@v4

      - name: 2. Configura JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 3. Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 4. Prepara debug.keystore per test (nessuna chiave generata)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore.base64 ]; then
            echo "::error::debug.keystore.base64 mancante."
            exit 1
          fi
          tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: 5. Verifica sicurezza (nessun keystore Release o backup cifrato nel repo)
        shell: bash
        run: |
          set -euo pipefail
          TRACKED=$(git ls-files '*.jks' '*.keystore' '*.p12' '*.pfx' '*.enc' '.env' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::Trovati file sensibili tracciati da Git: $TRACKED"
            exit 1
          fi

      - name: 6. Verifica dipendenze Release e Debug
        run: gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon >/dev/null

      - name: 7. Compilazione Debug e Kotlin Release
        run: gradle :app:assembleDebug :app:compileReleaseKotlin --no-daemon

      - name: 8. Esecuzione test unitari e Robolectric
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: 9. Verifica metadati version.properties e applicationId
        shell: bash
        run: |
          set -euo pipefail
          source version.properties
          echo "Versione configurata: ${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH} (versionCode=${VERSION_CODE})"
          grep -q 'applicationId = "com.aistudio.pantrymaster.vrkqzm"' app/build.gradle.kts
          echo "NOTA: La compilazione e firma ufficiale Release (.apk/.aab) vengono eseguite esclusivamente in locale su Windows tramite PantryMaster-Release-Manager.ps1."

      - name: 10. Pulizia
        if: always()
        shell: bash
        run: rm -f debug.keystore

      - name: Carica report test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-release-test-reports-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
