name: Release Progressiva

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Tipo di incremento versione (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Pubblica come pre-release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build e Pubblicazione Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Incrementa versione e crea tag (workflow_dispatch)
        id: bump
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          source version.properties
          MAJOR=${VERSION_MAJOR:-1}
          MINOR=${VERSION_MINOR:-0}
          PATCH=${VERSION_PATCH:-0}
          CODE=${VERSION_CODE:-1}
          REPO=${GITHUB_REPO:-}

          git fetch --tags --quiet || true
          case "${{ inputs.bump_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          while git rev-parse "v${MAJOR}.${MINOR}.${PATCH}" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
          done
          CODE=$((CODE >= GITHUB_RUN_NUMBER ? CODE + 1 : GITHUB_RUN_NUMBER))
          NEW_NAME="${MAJOR}.${MINOR}.${PATCH}"
          TAG_NAME="v${NEW_NAME}"

          cat > version.properties <<EOF
          VERSION_MAJOR=${MAJOR}
          VERSION_MINOR=${MINOR}
          VERSION_PATCH=${PATCH}
          VERSION_CODE=${CODE}
          GITHUB_REPO=${REPO}
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(release): ${TAG_NAME} (build ${CODE})"
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME} (versionCode ${CODE})"
          git push origin HEAD
          git push origin "${TAG_NAME}"

          echo "version_name=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Risolvi versione da tag (push tag)
        id: tag_ver
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          source version.properties
          RAW_TAG="${GITHUB_REF_NAME#v}"
          BASE_CODE=${VERSION_CODE:-1}
          PROGRESSIVE_CODE=$((BASE_CODE > GITHUB_RUN_NUMBER ? BASE_CODE : GITHUB_RUN_NUMBER))
          echo "version_name=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${PROGRESSIVE_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Imposta variabili versione finali
        id: final_ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version_name=${{ steps.bump.outputs.version_name }}" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ steps.bump.outputs.version_code }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ steps.bump.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version_name=${{ steps.tag_ver.outputs.version_name }}" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ steps.tag_ver.outputs.version_code }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ steps.tag_ver.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepara debug.keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Esegui test unitari
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Prepara firma release (se configurata nei Secrets)
        id: signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "has_release_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compila APK / AAB Release firmata
        if: steps.signing.outputs.has_release_signing == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gradle :app:assembleRelease :app:bundleRelease \
            -PversionCode=${{ steps.final_ver.outputs.version_code }} \
            -PversionName=${{ steps.final_ver.outputs.version_name }} \
            -PgithubRepo=${{ github.repository }} \
            --no-daemon
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk \
            "release-assets/PantryMaster-v${{ steps.final_ver.outputs.version_name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
            "release-assets/PantryMaster-v${{ steps.final_ver.outputs.version_name }}.aab"
          rm -f my-upload-key.jks

      - name: Compila APK installabile (fallback senza keystore release)
        if: steps.signing.outputs.has_release_signing != 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gradle :app:assembleDebug \
            -PversionCode=${{ steps.final_ver.outputs.version_code }} \
            -PversionName=${{ steps.final_ver.outputs.version_name }} \
            -PgithubRepo=${{ github.repository }} \
            --no-daemon
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk \
            "release-assets/PantryMaster-v${{ steps.final_ver.outputs.version_name }}.apk"

      - name: Pubblica GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.final_ver.outputs.tag_name }}
          name: PantryMaster ${{ steps.final_ver.outputs.tag_name }} (build ${{ steps.final_ver.outputs.version_code }})
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || false }}
          files: release-assets/*
