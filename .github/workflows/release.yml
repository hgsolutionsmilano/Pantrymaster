name: Verifica Pre-Release (Solo Controlli CI)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre_release_checks:
    name: Controlli Codice Pre-Release (Firma Locale Obbligatoria)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout codice
        uses: actions/checkout@v4

      - name: 2. Configura JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 3. Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 4. Verifica sicurezza (nessun keystore Release o backup cifrato nel repo)
        shell: bash
        run: |
          set -euo pipefail
          TRACKED=$(git ls-files '*.jks' '*.keystore' '*.p12' '*.pfx' '*.enc' '.env' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::Trovati file sensibili tracciati da Git: $TRACKED"
            exit 1
          fi

      - name: 5. Prepara keystore Debug temporaneo standard per test
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            if [ -f "$HOME/.android/debug.keystore" ]; then
              cp "$HOME/.android/debug.keystore" debug.keystore
            else
              CI_DBG_PASS="android"
              export CI_DBG_PASS
              keytool -genkeypair \
                -keystore debug.keystore \
                -storetype PKCS12 \
                -alias androiddebugkey \
                -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10950 \
                -storepass:env CI_DBG_PASS \
                -keypass:env CI_DBG_PASS >/dev/null 2>&1
              unset CI_DBG_PASS
            fi
          fi

      - name: 6. Verifica dipendenze Release e Debug
        run: gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon >/dev/null

      - name: 7. Compilazione Debug e Kotlin Release
        run: gradle :app:assembleDebug :app:compileReleaseKotlin --no-daemon

      - name: 8. Verifica firma APK Debug e blocco Release senza keystore privato
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          fi
          if gradle :app:verifyReleaseSigning --no-daemon >/dev/null 2>&1; then
            echo "::error::La build Release non deve procedere senza keystore Release privato."
            exit 1
          fi
          echo "OK: protezione firma Release attiva (nessun fallback a Debug)."

      - name: 9. Esecuzione test unitari e Robolectric
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: 10. Verifica metadati version.properties e applicationId
        shell: bash
        run: |
          set -euo pipefail
          source version.properties
          echo "Versione configurata: ${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH} (versionCode=${VERSION_CODE})"
          grep -q 'applicationId = "com.aistudio.pantrymaster.vrkqzm"' app/build.gradle.kts
          echo "NOTA: La compilazione e firma ufficiale Release (.apk/.aab) vengono eseguite esclusivamente in locale su Windows tramite PantryMaster-Release-Manager.ps1."

      - name: 11. Pulizia keystore temporaneo Debug
        if: always()
        shell: bash
        run: rm -f debug.keystore

      - name: Carica report test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-release-test-reports-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
